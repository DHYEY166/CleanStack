# GitHub Actions CI. Runs the same gate as ci/verify.sh (see CONTRIBUTING.md).
#
# NOT ACTIVE YET: GitHub only runs workflows from .github/workflows/, and the
# token that pushed this branch lacks the `workflow` scope, so the file is
# parked here. To enable it (needs a token with `workflow` scope or the web UI):
#   git mv ci/github-actions-ci.yml .github/workflows/ci.yml
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: eslint
        run: npx eslint
      - name: typecheck
        run: npx tsc --noEmit
      - name: unit tests (vitest)
        run: npx vitest run
      - name: next build
        # No secrets are needed to build; routes validate env at request time.
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  lambdas:
    name: lambdas (pandas ${{ matrix.pandas }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned in lambdas/*/requirements.txt
          - pandas: "2.2.3"
            numpy: "2.1.3"
          # The AWSSDKPandas layer version in production is not recorded in
          # the repo, so the handlers are also tested against pandas 3.
          - pandas: "3.0.6"
            numpy: "2.5.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lambdas/**/requirements*.txt
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r lambdas/requirements-dev.txt
          pip install "pandas==${{ matrix.pandas }}" "numpy==${{ matrix.numpy }}"
      - name: pytest
        run: python -m pytest -q lambdas/tests
