# GitHub Actions CI. Runs the same gate as ci/verify.sh (see CONTRIBUTING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: eslint
        run: npx eslint
      - name: typecheck
        run: npx tsc --noEmit
      - name: unit tests (vitest)
        run: npx vitest run
      - name: next build
        # No secrets are needed to build; routes validate env at request time.
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  lambdas:
    name: lambdas (pandas ${{ matrix.pandas }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned in lambdas/*/requirements.txt
          - pandas: "2.2.3"
            numpy: "2.1.3"
          # The AWSSDKPandas layer version in production is not recorded in
          # the repo, so the handlers are also tested against pandas 3.
          - pandas: "3.0.6"
            numpy: "2.5.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lambdas/**/requirements*.txt
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r lambdas/requirements-dev.txt
          pip install "pandas==${{ matrix.pandas }}" "numpy==${{ matrix.numpy }}"
      - name: pytest
        run: python -m pytest -q lambdas/tests

  # Real Postgres + LocalStack (S3, SQS). No AWS credentials or Bedrock: the
  # suites run in test mode (src/lib/test-mode.ts) with the fake model.
  integration:
    name: integration (postgres + localstack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleanstack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      localstack:
        # Pinned: newer images require a LocalStack auth token.
        image: localstack/localstack:3.8
        env:
          SERVICES: s3,sqs
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lambdas/**/requirements*.txt
      - run: npm ci
      - name: install lambda deps
        run: |
          python -m pip install --upgrade pip
          pip install -r lambdas/requirements-dev.txt
      - name: prepare services (schema + migrations, versioned buckets, queues)
        run: node tests/support/setup-services.mjs
      - name: integration tests (vitest, route handlers + in-process Lambdas)
        run: npm run test:integration
        env:
          PYTHON: python
      - name: integration tests (pytest, Lambda handlers)
        run: python -m pytest -q lambdas/tests/integration
        env:
          CLEANSTACK_INTEGRATION: "1"

  # Browser e2e against the production build (next start) in test mode, with
  # the same service containers and the real Lambda handlers in-process.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleanstack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      localstack:
        image: localstack/localstack:3.8
        env:
          SERVICES: s3,sqs
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lambdas/**/requirements*.txt
      - run: npm ci
      - name: install lambda deps
        run: |
          python -m pip install --upgrade pip
          pip install -r lambdas/requirements-dev.txt
      - name: install chromium
        run: npx playwright install --with-deps chromium
      - name: prepare services (schema + migrations, versioned buckets, queues)
        run: node tests/support/setup-services.mjs
      - name: next build (test mode)
        run: npm run e2e:build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: playwright
        run: npm run test:e2e
        env:
          PYTHON: python
          NEXT_TELEMETRY_DISABLED: "1"
      - name: upload playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
